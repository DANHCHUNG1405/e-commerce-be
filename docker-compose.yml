services:
  api:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    environment:
      NOTIFICATION_SERVICE_URL: http://notification:8082
      CHAT_SERVICE_URL: http://chat:8083
      CHAT_GRPC_TARGET: chat:9091
      IDENTITY_SERVICE_URL: http://identity:8084
      SELLER_SERVICE_URL: http://seller:8085
      SELLER_GRPC_TARGET: seller:9093
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_SEARCH_MODE: ${ELASTICSEARCH_SEARCH_MODE:-postgres}
    depends_on:
      db:
        condition: service_healthy
  search-indexer:
    build:
      context: .
      args:
        APP_BINARY: search-indexer
    env_file: .env
    environment:
      KAFKA_BROKERS: kafka:9092
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
      elasticsearch:
        condition: service_started
  search-reindex:
    profiles: ["tools"]
    build:
      context: .
      args:
        APP_BINARY: search-reindex
    env_file: .env
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      db:
        condition: service_healthy
      elasticsearch:
        condition: service_started
  outbox-relay:
    build:
      context: .
      args:
        APP_BINARY: outbox-relay
    env_file: .env
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
  notification:
    build:
      context: .
      args:
        APP_BINARY: notification
    env_file: .env
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_NOTIFICATION_DLQ_TOPIC: ecommerce.notification.dlq.v1
      NOTIFICATION_PORT: "8082"
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8082/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  chat:
    build:
      context: .
      args:
        APP_BINARY: chat
    env_file: .env
    environment:
      CHAT_HTTP_PORT: "8083"
      CHAT_GRPC_PORT: "9091"
      IDENTITY_GRPC_TARGET: identity:9092
      SELLER_GRPC_TARGET: seller:9093
    ports:
      - "8083:8083"
    expose:
      - "9091"
    depends_on:
      db:
        condition: service_healthy
      identity:
        condition: service_healthy
      seller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8083/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  identity:
    build:
      context: .
      args:
        APP_BINARY: identity
    env_file: .env
    environment:
      IDENTITY_HTTP_PORT: "8084"
      IDENTITY_GRPC_PORT: "9092"
      SELLER_GRPC_TARGET: seller:9093
    ports:
      - "8084:8084"
    expose:
      - "9092"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8084/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  seller:
    build:
      context: .
      args:
        APP_BINARY: seller
    env_file: .env
    environment:
      SELLER_HTTP_PORT: "8085"
      SELLER_GRPC_PORT: "9093"
    ports:
      - "8085:8085"
    expose:
      - "9093"
    depends_on:
      db:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8085/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    image: redpandadata/redpanda:v25.2.1
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://kafka:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - kafka_data:/var/lib/redpanda/data

  kafka-ui:
    image: redpandadata/console:latest
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "false"
    ports:
      - "8081:8080"
    depends_on:
      kafka:
        condition: service_started

volumes:
  postgres_data:
  kafka_data:
  elasticsearch_data:
