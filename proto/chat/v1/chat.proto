syntax = "proto3";

package ecommerce.chat.v1;

option go_package = "github.com/example/e-commerce-be/internal/gen/chat/v1;chatv1";

import "google/protobuf/timestamp.proto";

service ChatService {
  rpc OpenConversation(OpenConversationRequest) returns (Conversation);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc SendMessage(SendMessageRequest) returns (Message);
  rpc MarkRead(MarkReadRequest) returns (ReadMarker);
}

message OpenConversationRequest {
  string seller_id = 1;
}

message ListConversationsRequest {
  int32 page = 1;
  int32 limit = 2;
}

message ListConversationsResponse {
  repeated Conversation items = 1;
}

message ListMessagesRequest {
  string conversation_id = 1;
  optional int64 after = 2;
  optional int64 before = 3;
  int32 limit = 4;
}

message ListMessagesResponse {
  repeated Message items = 1;
}

message SendMessageRequest {
  string conversation_id = 1;
  string client_message_id = 2;
  string body = 3;
}

message MarkReadRequest {
  string conversation_id = 1;
  int64 sequence = 2;
}

message Conversation {
  string id = 1;
  string buyer_id = 2;
  string seller_id = 3;
  int64 last_sequence = 4;
  int64 unread_count = 5;
  int64 last_read_sequence = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message Message {
  string id = 1;
  string conversation_id = 2;
  string sender_id = 3;
  string client_message_id = 4;
  int64 sequence = 5;
  string body = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message ReadMarker {
  string conversation_id = 1;
  string user_id = 2;
  int64 last_sequence = 3;
  google.protobuf.Timestamp updated_at = 4;
}
